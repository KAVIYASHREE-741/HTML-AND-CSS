<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Chat Container */
.chat-container {
    width: 360px;
    height: 600px;
    background: white;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    overflow: hidden;
}

/* Header */
.chat-header {
    background: #2563eb;
    color: white;
    padding: 15px;
    display: flex;
    align-items: center;
}

.chat-header img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 10px;
}

/* Messages */
.chat-body {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #e5ddd5;
}

.message {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.4;
}

/* Incoming */
.message.left {
    background: white;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
}

/* Outgoing */
.message.right {
    background: #2563eb;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
}

/* Input Area */
.chat-footer {
    padding: 10px;
    display: flex;
    border-top: 1px solid #ddd;
    background: white;
}

.chat-footer input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
    outline: none;
}

.chat-footer button {
    margin-left: 10px;
    background: #2563eb;
    border: none;
    color: white;
    padding: 10px 16px;
    border-radius: 50%;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
        <img src="https://i.pravatar.cc/150?img=12">
        <div>
            <strong>Alex</strong><br>
            <small>Online</small>
        </div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-body">
        <div class="message left">Hey! 👋</div>
        <div class="message left">How are you?</div>
        <div class="message right">I'm good 😊</div>
        <div class="message right">Working on a chat UI</div>
        <div class="message left">Looks awesome already 🔥</div>
    </div>

    <!-- Input -->
    <div class="chat-footer">
        <input type="text" placeholder="Type a message...">
        <button>➤</button>
    </div>

</div>

</body>
</html>
